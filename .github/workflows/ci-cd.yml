name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  # Nunca perguntar nada no terminal: com o backend `cloud` declarado, um prompt
  # de credencial travaria o job em vez de falhar.
  TF_INPUT: "0"

jobs:
  # ─── CI: validação e análise estática do Terraform ─────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Init (sem backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Validate
        run: terraform -chdir=terraform validate

      - name: Lint (tflint)
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run tflint
        run: |
          tflint --init
          tflint --chdir=terraform --recursive

      # Análise de segurança da infraestrutura como código.
      #
      # `soft_fail: false`: o scanner reprova o build. Um scanner que só reporta
      # é um scanner que ninguém lê — o valor dele está em barrar o achado novo,
      # aquele que entrou sem que ninguém percebesse.
      #
      # Para isso funcionar, os achados que já existem e são aceitos precisam
      # estar listados um a um em `skip_check`, com a razão registrada. A lista
      # abaixo é o inventário das concessões desta arquitetura; qualquer coisa
      # fora dela derruba a pipeline.
      #
      # ┌ CKV_AWS_38/39  Endpoint público do EKS
      # │  A pipeline do GitHub Actions e a máquina do desenvolvedor alcançam a
      # │  API do cluster pela internet. Fechar o endpoint exigiria runner
      # │  self-hosted dentro da VPC ou VPN — desproporcional para um cluster
      # │  que sobe e desce em algumas horas. O acesso continua autenticado por
      # │  IAM; público não significa aberto.
      # │
      # ├ CKV_AWS_130   Subnets com IP público automático
      # │  É o desenho da rede, não um descuido: sem NAT Gateway (que custaria
      # │  US$8,60/mês, mais que o dobro do cluster inteiro), os nós precisam de
      # │  IP próprio para puxar imagens. Como esta conta não permite Load
      # │  Balancer, é também o IP do nó que expõe o gateway. Ver CUSTO.md.
      # │
      # ├ CKV_AWS_58    Secrets do EKS sem envelope encryption por KMS
      # │  Exigiria uma chave KMS gerenciada (US$1/mês) para proteger secrets
      # │  que já não guardam nada: as credenciais reais vivem nos secrets do
      # │  GitHub Actions e são injetadas em tempo de deploy.
      # │
      # ├ CKV2_AWS_11   VPC sem flow logs
      # │  Flow logs vão para CloudWatch, que cobra por ingestão. Os logs de
      # │  cluster já estão desligados pelo mesmo motivo (ver eks.tf).
      # │
      # └ CKV2_AWS_12   Security group default sem restrição
      #    O SG default da VPC não é usado por recurso nenhum: os nós e o
      #    control plane têm SGs próprios, criados pelo EKS.
      - name: Security scan (checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          output_format: cli
          skip_check: CKV_AWS_38,CKV_AWS_39,CKV_AWS_130,CKV_AWS_58,CKV2_AWS_11,CKV2_AWS_12

  # ─── Plan: mostra o que mudaria, sem criar nada ────────────────────────────
  # Quando o cluster era kind local, este job subia um cluster inteiro a cada
  # execução — era grátis. Com o EKS isso custaria ~US$0,60 e 30 minutos por PR,
  # então o smoke test deu lugar a um `plan`, que valida a configuração contra a
  # API real da AWS sem provisionar recurso nenhum.
  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: autogiro-infra-k8s-${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
        run: terraform -chdir=terraform init

      - name: Terraform Plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: autogiro-infra-k8s-${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          TF_VAR_new_relic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_new_relic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
        # `-lock=false`: o plan so le o state, nao escreve. Sem isso, o push e o
        # pull_request do mesmo commit disparam dois planos simultaneos no mesmo
        # workspace e um derruba o outro com "state lock". O apply continua com
        # lock, que e onde ele protege de fato.
        run: terraform -chdir=terraform plan -no-color -lock=false

  # ─── CD: provisiona o cluster na AWS ───────────────────────────────────────
  # Com o cluster na nuvem, o runner hospedado do GitHub alcança a AWS
  # normalmente — o self-hosted runner deixou de ser necessário.
  #
  # O apply continua protegido por DEPLOY_ENABLED: criar um EKS custa dinheiro,
  # então subir o cluster é uma decisão explícita, não efeito colateral de um push.
  #
  # E só em `develop`. O motivo é concreto: o workspace de prod tem state próprio,
  # então um apply nele não reaproveita o cluster de homolog — tenta criar um
  # segundo, do zero. Isso falha, porque as IAM Roles são globais na conta
  # (`EntityAlreadyExists`), mas só depois de já ter criado a VPC, as subnets e o
  # internet gateway, que ficam órfãos cobrando fora de qualquer state. Aconteceu
  # em 09/09 e a limpeza foi manual.
  #
  # Um ambiente de produção de verdade seria uma conta AWS separada, com IAM
  # próprio; dentro de uma única conta, dois clusters completos dobrariam o custo
  # (~US$107/mês) sem acrescentar nada à entrega. O `plan` continua rodando em
  # `main`, então a configuração segue validada contra a AWS real nos dois ramos.
  deploy:
    name: Deploy cluster
    needs: plan
    if: github.ref_name == 'develop' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: autogiro-infra-k8s-${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
        run: terraform -chdir=terraform init

      - name: Terraform Apply
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: autogiro-infra-k8s-${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          TF_VAR_new_relic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_new_relic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
        run: terraform -chdir=terraform apply -auto-approve

      - name: Resumo
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: autogiro-infra-k8s-${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
        run: |
          {
            echo "### Cluster provisionado"
            echo ""
            echo "- Cluster: $(terraform -chdir=terraform output -raw cluster_name)"
            echo "- Gateway: $(terraform -chdir=terraform output -raw kong_proxy_url 2>/dev/null || echo 'aguardando o Load Balancer')"
            echo ""
            echo "Lembre-se de destruir o cluster ao terminar: ele cobra por hora."
          } >> "$GITHUB_STEP_SUMMARY"
